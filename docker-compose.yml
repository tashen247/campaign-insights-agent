services:
  agent:
    build: .
    env_file: .env
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./runs:/app/runs
      - ./memory:/app/memory

  n8n:
    image: n8nio/n8n:1.123.0
    ports:
      - "5678:5678"
    environment:
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: Africa/Johannesburg
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - agent

volumes:
  n8n_data:
